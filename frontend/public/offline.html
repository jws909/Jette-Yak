<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8b3e4b" />
    <title>인터넷 연결 확인 | 제때약</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #302c29;
        background: #f7f4ee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px 28px; border: 1px solid #e5dbd4; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 12px 40px #302c2908; }
      .brand { margin: 0 0 32px; color: #8b3e4b; font-weight: 800; font-size: 20px; letter-spacing: -.04em; }
      .symbol { display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 50%; color: #8b3e4b; background: #f8eef0; }
      h1 { margin: 0 0 14px; font-size: clamp(22px, 5vw, 27px); letter-spacing: -.05em; line-height: 1.45; word-break: keep-all; }
      p { margin: 0; color: #756b62; font-size: 15px; line-height: 1.8; word-break: keep-all; }
      .notice { margin: 24px 0; padding: 18px; border-radius: 12px; background: #f7f4ee; font-size: 14px; }
      button { width: 100%; min-height: 48px; padding: 12px 20px; border: 0; border-radius: 12px; color: #fff; background: #8b3e4b; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #72313e; }
      button:focus-visible { outline: 3px solid #8b3e4b; outline-offset: 4px; }
      noscript { display: block; margin-top: 18px; color: #756b62; line-height: 1.7; }
      @media (max-width: 360px) { body { padding: 16px; } main { padding: 28px 20px; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <p class="brand">제때약</p>
      <div class="symbol" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M7 15a20 20 0 0 1 26 0M12 21a12 12 0 0 1 16 0M17 27a5 5 0 0 1 6 0M5 5l30 30" />
          <circle cx="20" cy="33" r="1.5" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <h1 id="offline-title">잠시 연결이 끊겼어요</h1>
      <p>Wi-Fi 또는 모바일 데이터 연결을 확인한 뒤<br />다시 시도해 주세요.</p>
      <p class="notice">복약 기록과 처방전, 가족·커뮤니티 정보는<br />인터넷에 연결한 뒤 확인하고 변경할 수 있어요.</p>
      <button id="retry" type="button">다시 시도</button>
      <noscript>인터넷에 연결한 뒤 이 화면을 새로고침해 주세요.</noscript>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => {
        window.location.reload()
      })
    </script>
  </body>
</html>
